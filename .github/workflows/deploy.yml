name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web-hiding/package-lock.json

      # --- Main map (web/) → https://jchen3652.github.io/jetlag/ ---
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build main map for GitHub Pages
        working-directory: web
        run: npm run build
        env:
          GITHUB_PAGES: true

      # --- Hiding finder (web-hiding/) → https://jchen3652.github.io/jetlag/hiding/ ---
      - name: Prepare web-hiding public data
        run: |
          # public/data is a local symlink and is not in git; copy data for the build
          mkdir -p web-hiding/public
          rm -rf web-hiding/public/data
          cp -R web/public/data web-hiding/public/data
          ls -la web-hiding/public/data | head

      - name: Install web-hiding dependencies
        working-directory: web-hiding
        run: npm ci

      - name: Build hiding map for GitHub Pages
        working-directory: web-hiding
        run: npm run build
        env:
          GITHUB_PAGES: true

      - name: Merge hiding app into site as /hiding/
        run: |
          mkdir -p web/dist/hiding
          cp -R web-hiding/dist/. web/dist/hiding/
          echo "=== Final site tree (top) ==="
          find web/dist -maxdepth 3 -type f | sort | head -80
          echo "=== hiding/index.html present? ==="
          test -f web/dist/hiding/index.html && echo yes || echo NO
          echo "=== data in hiding? ==="
          ls web/dist/hiding/data 2>&1 | head || ls web/dist/data 2>&1 | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
